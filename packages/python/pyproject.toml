[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsu"
version = "1.2.0"
description = "Everyday helpers you would otherwise write yourself: slugs, text case, date math, file size formatting, deep clone and merge, validation, hashing and file utilities."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "CDGet", email = "jooy2.contact@gmail.com" }]
requires-python = ">=3.8"
dependencies = ["cryptography>=42.0"]
keywords = [
    "util",
    "utility",
    "utils",
    "toolkit",
    "helper",
    "helpers",
    "array",
    "list",
    "dict",
    "object",
    "string",
    "date",
    "math",
    "format",
    "validation",
    "verify",
    "crypto",
    "hash",
    "encrypt",
    "base64",
    "file",
    "web",
    "slug",
    "debounce",
    "throttle",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://qsu.cdget.com"
Repository = "https://github.com/jooy2/qsu"
"Bug Tracker" = "https://github.com/jooy2/qsu/issues"
Changelog = "https://qsu.cdget.com/changelog/python"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11"]

[tool.mypy]
files = ["qsu"]

[tool.hatch.build.targets.wheel]
packages = ["qsu"]

[tool.hatch.build.targets.sdist]
include = ["qsu", "README.md", "LICENSE"]
